name: Publish Windows release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build and publish Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run checks
        run: npm run check

      - name: Smoke-test Electron
        run: npm run smoke:electron

      - name: Build Windows x64 installer
        run: npm run electron:build:win

      - name: Smoke-test packaged application
        run: npm run smoke:packaged

      - name: Create Windows checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem -LiteralPath release -Filter "Image-Compare-$version-Windows-x64-Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not created." }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath release/WINDOWS_SHA256SUMS.txt -Encoding utf8

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-Compare-${{ steps.package.outputs.version }}-Windows-x64
          path: |
            release/Image-Compare-${{ steps.package.outputs.version }}-Windows-x64-Setup.exe
            release/WINDOWS_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "release/Image-Compare-${{ steps.package.outputs.version }}-Windows-x64-Setup.exe"
          release/WINDOWS_SHA256SUMS.txt
          --title "图片对比工具 $GITHUB_REF_NAME"
          --generate-notes
